name: Deploy to Azure Web App
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Créer un petit ZIP pour le déploiement
      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          zip -r deploy.zip . -x "*.git*" -x "*.ipynb" -x "leftImg8bit/*" -x "gtFine/*"
          ls -la deploy.zip

      # Installer Azure CLI
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Diagnostique - Vérifier l'URL SCM correcte
      - name: Get correct SCM URL
        run: |
          APP_NAME="unet-segmentation-api"
          RG_NAME="unet-segmentation-rg"
          echo "Getting app details..."
          az webapp show --name $APP_NAME --resource-group $RG_NAME

          # Obtenir l'URL SCM correcte
          SCM_HOST=$(az webapp show --name $APP_NAME --resource-group $RG_NAME --query defaultHostName --output tsv)
          CORRECT_SCM_URL="https://${SCM_HOST/\.azurewebsites\.net/.scm.azurewebsites.net}"
          echo "Correct SCM URL should be: $CORRECT_SCM_URL"

      # Arrêter l'application
      - name: Stop Web App
        run: |
          echo "Stopping web app..."
          az webapp stop --name unet-segmentation-api --resource-group unet-segmentation-rg

      # Utilisez l'action officielle pour le déploiement
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'unet-segmentation-api'
          package: './deploy.zip'

      # Vérifier l'état du déploiement
      - name: Verify deployment
        run: |
          echo "Vérification du statut de l'application web..."

          # Vérifier l'état de l'application
          az webapp show --name unet-segmentation-api --resource-group unet-segmentation-rg --query state --output tsv

          # Obtenir les informations de publication
          echo "Récupération des informations de publication..."
          PUBLISH_PROFILE=$(az webapp deployment list-publishing-credentials --name unet-segmentation-api --resource-group unet-segmentation-rg --output json)
          USERNAME=$(echo $PUBLISH_PROFILE | jq -r '.publishingUserName')
          PASSWORD=$(echo $PUBLISH_PROFILE | jq -r '.publishingPassword')

          # Obtenir l'URL SCM correcte
          echo "Récupération de l'URL SCM correcte..."
          SCM_HOST=$(az webapp show --name unet-segmentation-api --resource-group unet-segmentation-rg --query defaultHostName --output tsv)
          echo "Host de l'application: $SCM_HOST"

          # Construire l'URL SCM (méthode alternative sans substitution)
          SCM_HOST_PREFIX=${SCM_HOST%%.*}
          SCM_URL="https://$SCM_HOST_PREFIX.scm.azurewebsites.net"
          echo "URL SCM construite: $SCM_URL"

          # Vérifier si l'URL SCM est accessible
          echo "Test de connexion à l'URL SCM..."
          curl -s -I -u "$USERNAME:$PASSWORD" "$SCM_URL" | head -n 1

          # Lister les fichiers dans wwwroot
          echo "Liste des fichiers dans wwwroot..."
          curl -s -u "$USERNAME:$PASSWORD" "$SCM_URL/api/vfs/site/wwwroot/" | jq '.[].name'

          # Lister également les fichiers dans le répertoire wwwroot/site
          echo "Liste des fichiers dans le répertoire parent..."
          curl -s -u "$USERNAME:$PASSWORD" "$SCM_URL/api/vfs/site/" | jq '.[].name'

      # Démarrer l'application
      - name: Start Web App
        run: |
          echo "Starting web app..."
          az webapp start --name unet-segmentation-api --resource-group unet-segmentation-rg

          # Attendre que l'app démarre
          echo "Waiting for app to start..."
          sleep 30
      # Vérifier l'état des logs de l'application
      - name: Check application logs (recent)
        run: |
          az webapp log download --resource-group unet-segmentation-rg --name unet-segmentation-api
          unzip webapp_logs.zip -d logs
          echo "Dernières lignes du log :"
          tail -n 50 logs/**/default_docker.log || echo "Aucun log trouvé."
