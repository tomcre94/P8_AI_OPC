name: Deploy to Azure Web App
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Créer un petit ZIP pour le déploiement
      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          zip -r deploy.zip . -x "*.git*" -x "*.ipynb" -x "leftImg8bit/*" -x "gtFine/*"
          ls -la deploy.zip

      # Installer Azure CLI
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Diagnostique - Vérifier l'URL SCM correcte
      - name: Get correct SCM URL
        run: |
          APP_NAME="unet-segmentation-api"
          RG_NAME="unet-segmentation-rg"
          echo "Getting app details..."
          az webapp show --name $APP_NAME --resource-group $RG_NAME

          # Obtenir l'URL SCM correcte
          SCM_HOST=$(az webapp show --name $APP_NAME --resource-group $RG_NAME --query defaultHostName --output tsv)
          CORRECT_SCM_URL="https://${SCM_HOST/\.azurewebsites\.net/.scm.azurewebsites.net}"
          echo "Correct SCM URL should be: $CORRECT_SCM_URL"

      # Arrêter l'application
      - name: Stop Web App
        run: |
          echo "Stopping web app..."
          az webapp stop --name unet-segmentation-api --resource-group unet-segmentation-rg

      # Utilisez l'action officielle pour le déploiement
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'unet-segmentation-api'
          package: './deploy.zip'

      # Vérifier l'état du déploiement
      - name: Verify deployment
        run: |
          echo "Checking deployment status..."

          # La commande correcte pour lister les déploiements
          echo "Getting deployment history..."
          az webapp deployment list-deployments --name unet-segmentation-api --resource-group unet-segmentation-rg

          # Obtenir les creds de publication pour vérifier les fichiers
          PUBLISH_PROFILE=$(az webapp deployment list-publishing-credentials --name unet-segmentation-api --resource-group unet-segmentation-rg --output json)
          USERNAME=$(echo $PUBLISH_PROFILE | jq -r '.publishingUserName')
          PASSWORD=$(echo $PUBLISH_PROFILE | jq -r '.publishingPassword')

          # Obtenir l'URL SCM correcte
          SCM_HOST=$(az webapp show --name unet-segmentation-api --resource-group unet-segmentation-rg --query defaultHostName --output tsv)
          # Corriger la syntaxe pour substituer le texte dans la variable
          SCM_URL="https://${SCM_HOST/.azurewebsites.net/.scm.azurewebsites.net}"

          echo "SCM URL: $SCM_URL"

          echo "Listing files in wwwroot to verify deployment..."
          curl -s -u "$USERNAME:$PASSWORD" "$SCM_URL/api/vfs/site/wwwroot/" | jq '.[].name'

      # Démarrer l'application
      - name: Start Web App
        run: |
          echo "Starting web app..."
          az webapp start --name unet-segmentation-api --resource-group unet-segmentation-rg

          # Attendre que l'app démarre
          echo "Waiting for app to start..."
          sleep 30

          # Vérifier les logs de l'application
          echo "Checking application logs..."
          az webapp log tail --name unet-segmentation-api --resource-group unet-segmentation-rg --timeout 60
