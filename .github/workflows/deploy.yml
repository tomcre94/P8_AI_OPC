# .github/workflows/deploy.yml
name: Deploy to Azure Web App
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Créer un petit ZIP pour le déploiement
      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          rm -f deploy.zip
          zip -r deploy.zip . -x "*.git*" -x "*.ipynb" -x "deploy.zip"
          ls -la deploy.zip

      # Installer Azure CLI
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Récupérer les informations de publication de manière plus fiable
      - name: Get Publishing Profile
        id: get-publish-profile
        run: |
          PUBLISH_CREDS=$(az webapp deployment list-publishing-credentials --name unet-segmentation-api --resource-group unet-segmentation-rg --output json)
          if [ $? -ne 0 ]; then
            echo "Failed to get publishing credentials"
            exit 1
          fi
          PUBLISH_USERNAME=$(echo $PUBLISH_CREDS | jq -r '.publishingUserName')
          PUBLISH_PASSWORD=$(echo $PUBLISH_CREDS | jq -r '.publishingPassword')
          # Obtenir l'URL SCM dynamiquement au lieu de l'encoder en dur
          SCM_URL="https://$(az webapp show --name unet-segmentation-api --resource-group unet-segmentation-rg --query defaultHostName --output tsv | sed 's/\.azurewebsites\.net//')"
          SCM_URL="${SCM_URL}.scm.azurewebsites.net"
          echo "username=$PUBLISH_USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PUBLISH_PASSWORD" >> $GITHUB_OUTPUT
          echo "scm_url=$SCM_URL" >> $GITHUB_OUTPUT

      # Arrêter l'application
      - name: Stop Web App
        run: |
          echo "Stopping web app..."
          az webapp stop --name unet-segmentation-api --resource-group unet-segmentation-rg
          if [ $? -ne 0 ]; then
            echo "Failed to stop web app"
            exit 1
          fi
          echo "Waiting for web app to stop completely..."
          # Vérifier que l'app est arrêtée plutôt que d'utiliser sleep
          RETRY=0
          MAX_RETRY=10
          while [ $RETRY -lt $MAX_RETRY ]; do
            STATUS=$(az webapp show --name unet-segmentation-api --resource-group unet-segmentation-rg --query state --output tsv)
            if [ "$STATUS" = "Stopped" ]; then
              echo "Web app stopped successfully"
              break
            fi
            RETRY=$((RETRY+1))
            echo "Web app still stopping, waiting... (attempt $RETRY/$MAX_RETRY)"
            sleep 10
          done
          if [ $RETRY -eq $MAX_RETRY ]; then
            echo "Failed to confirm web app has stopped"
            exit 1
          fi

      # Nettoyage radical via l'API Kudu VFS
      - name: Clean up files via Kudu API
        run: |
          USERNAME="${{ steps.get-publish-profile.outputs.username }}"
          PASSWORD="${{ steps.get-publish-profile.outputs.password }}"
          SCM_URL="${{ steps.get-publish-profile.outputs.scm_url }}"
          echo "Cleaning up wwwroot directory..."
          # Obtenir la liste des fichiers/dossiers dans wwwroot
          FILES=$(curl -s -u "$USERNAME:$PASSWORD" "https://$SCM_URL/api/vfs/site/wwwroot/" | jq -r '.[].name')
          if [ $? -ne 0 ]; then
            echo "Failed to get list of files"
            exit 1
          fi
          # Supprimer chaque fichier/dossier individuellement
          for FILE in $FILES; do
            echo "Deleting $FILE..."
            curl -X DELETE -u "$USERNAME:$PASSWORD" "https://$SCM_URL/api/vfs/site/wwwroot/$FILE"
            if [ $? -ne 0 ]; then
              echo "Warning: Failed to delete $FILE"
            fi
          done

      # Vérifier si le nettoyage a fonctionné
      - name: Verify cleanup
        run: |
          USERNAME="${{ steps.get-publish-profile.outputs.username }}"
          PASSWORD="${{ steps.get-publish-profile.outputs.password }}"
          SCM_URL="${{ steps.get-publish-profile.outputs.scm_url }}"
          REMAINING=$(curl -s -u "$USERNAME:$PASSWORD" "https://$SCM_URL/api/vfs/site/wwwroot/" | jq -r '.[].name')
          echo "Remaining files in wwwroot: $REMAINING"

      # Déployer via l'API ZIP de Kudu (méthode alternative)
      - name: Deploy via Kudu ZIP API
        id: deploy
        run: |
          USERNAME="${{ steps.get-publish-profile.outputs.username }}"
          PASSWORD="${{ steps.get-publish-profile.outputs.password }}"
          SCM_URL="${{ steps.get-publish-profile.outputs.scm_url }}"
          echo "Deploying via Kudu ZIP API..."
          DEPLOY_ID=$(curl -X POST -u "$USERNAME:$PASSWORD" \
            --data-binary @deploy.zip \
            -H "Content-Type: application/zip" \
            "https://$SCM_URL/api/zipdeploy?isAsync=true" -v 2>&1 | grep -i "location:" | awk '{print $3}' | tr -d '\r')

          if [ -z "$DEPLOY_ID" ]; then
            echo "Failed to start deployment"
            exit 1
          fi

          echo "Deployment started with ID: $DEPLOY_ID"
          echo "deployment_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

          # Vérifier l'état du déploiement jusqu'à ce qu'il soit terminé
          RETRY=0
          MAX_RETRY=20
          while [ $RETRY -lt $MAX_RETRY ]; do
            STATUS=$(curl -s -u "$USERNAME:$PASSWORD" "https://$SCM_URL/api/deployments/$DEPLOY_ID" | jq -r '.status')
            echo "Deployment status: $STATUS"
            
            if [ "$STATUS" = "success" ]; then
              echo "Deployment completed successfully!"
              break
            elif [ "$STATUS" = "failed" ]; then
              echo "Deployment failed!"
              curl -s -u "$USERNAME:$PASSWORD" "https://$SCM_URL/api/deployments/$DEPLOY_ID" | jq '.'
              exit 1
            fi
            
            RETRY=$((RETRY+1))
            echo "Waiting for deployment to complete... (attempt $RETRY/$MAX_RETRY)"
            sleep 15
          done

          if [ $RETRY -eq $MAX_RETRY ]; then
            echo "Deployment taking too long, may have failed"
            exit 1
          fi

      # Redémarrer l'application
      - name: Restart Web App
        run: |
          echo "Restarting web app..."
          az webapp start --name unet-segmentation-api --resource-group unet-segmentation-rg
          if [ $? -ne 0 ]; then
            echo "Failed to restart web app"
            exit 1
          fi

          echo "Waiting for web app to start completely..."
          # Vérifier que l'app est démarrée
          RETRY=0
          MAX_RETRY=10
          while [ $RETRY -lt $MAX_RETRY ]; do
            STATUS=$(az webapp show --name unet-segmentation-api --resource-group unet-segmentation-rg --query state --output tsv)
            if [ "$STATUS" = "Running" ]; then
              echo "Web app started successfully"
              break
            fi
            RETRY=$((RETRY+1))
            echo "Web app still starting, waiting... (attempt $RETRY/$MAX_RETRY)"
            sleep 10
          done

          if [ $RETRY -eq $MAX_RETRY ]; then
            echo "Failed to confirm web app has started"
            exit 1
          fi
